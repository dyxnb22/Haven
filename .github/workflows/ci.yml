name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # 两个平台都运行，因为每个平台都有自己的沙箱后端；缺少后端的平台会
    # 跳过强制执行测试。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Report sandbox backend
        run: >
          uv run python -c "from haven.bootstrap import select_launcher;
          l = select_launcher();
          print('backend:', l.backend if l else 'none', 'available:', bool(l and l.available()))"

      - name: Quality gates
        # CI 和开发者共同遍历同一张声明式图（scripts/gates.py），因此“CI 运行
        # 什么”和“本地能运行什么”不会逐渐偏离。`--list` 显示该图；
        # `--mode fast` 是不含测试的子集。
        run: uv run python scripts/gates.py --mode full
