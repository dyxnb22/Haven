name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Both platforms, because each has its own sandbox backend and the
    # enforcement tests skip where a backend is missing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Report sandbox backend
        run: >
          uv run python -c "from haven.bootstrap import select_launcher;
          l = select_launcher();
          print('backend:', l.backend if l else 'none', 'available:', bool(l and l.available()))"

      - name: Quality gates
        # One declarative graph (scripts/gates.py) that CI and developers both
        # traverse, so "what CI runs" and "what I can run locally" cannot drift.
        # `--list` shows the graph; `--mode fast` is the no-tests subset.
        run: uv run python scripts/gates.py --mode full
