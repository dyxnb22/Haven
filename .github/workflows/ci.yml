name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Both platforms, because each has its own sandbox backend and the
    # enforcement tests skip where a backend is missing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src

      - name: Report sandbox backend
        run: >
          uv run python -c "from haven.bootstrap import select_launcher;
          l = select_launcher();
          print('backend:', l.backend if l else 'none', 'available:', bool(l and l.available()))"

      - name: Pytest (with coverage)
        run: uv run coverage run -m pytest

      - name: Import linter
        run: uv run lint-imports

      - name: Offline eval (security gate)
        run: uv run haven eval --offline

      - name: Metrics are not stale
        # Runs last: needs the coverage data and the eval report the two steps
        # above produce. Fails if a committed number drifted from reality.
        run: uv run python scripts/refresh_metrics.py --check
