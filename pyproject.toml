[project]
name = "haven"
version = "0.1.0"
description = "Evidence-driven, replayable local TUI Coding Agent"
readme = "README.md"
authors = [
    { name = "diaoyuxuan", email = "714833073@qq.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "httpx",
    "platformdirs",
    "pydantic>=2",
    "pydantic-settings",
    "textual",
    "typer",
]

[project.scripts]
haven = "haven.interfaces.cli:app"

[dependency-groups]
dev = [
    "coverage",
    "hypothesis",
    "import-linter",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "respx",
    "ruff",
]
# Test-only dependencies of the pinned third-party repos in evals/real
# (their suites must run green in this venv; see evals/real/repos.lock):
# markupsafe + trio are jinja's declared test deps, wcag-contrast-ratio is
# pygments'. Pure test plumbing — Haven itself never imports any of them.
real-evals = [
    "markupsafe",
    "trio",
    "wcag-contrast-ratio",
]

[tool.uv]
default-groups = ["dev", "real-evals"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Ruff formats fenced Python inside Markdown. That is right for prose that
# ships, but a plan's snippets are deliberate fragments — a lone argument
# line, a partial call — and formatting them as whole modules corrupts the
# instruction: `flag: bool = True,` came back as `flag: bool = (True,)`.
exclude = ["docs/superpowers/plans/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["haven"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "haven"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is isolated"
type = "forbidden"
source_modules = ["haven.domain"]
forbidden_modules = [
    "haven.adapters",
    "haven.interfaces",
    "textual",
    "httpx",
    "aiosqlite",
]

[[tool.importlinter.contracts]]
name = "application does not import adapters"
type = "forbidden"
source_modules = ["haven.application"]
forbidden_modules = ["haven.adapters"]

# Interfaces may reach adapters only through the composition root
# (haven.bootstrap) or the eval harness; direct imports are forbidden.
[[tool.importlinter.contracts]]
name = "interfaces do not import adapters directly"
type = "forbidden"
source_modules = ["haven.interfaces"]
forbidden_modules = ["haven.adapters"]
allow_indirect_imports = true
