[project]
name = "haven"
version = "0.1.0"
description = "Evidence-driven, replayable local TUI Coding Agent"
readme = "README.md"
authors = [
    { name = "diaoyuxuan", email = "714833073@qq.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "httpx",
    "platformdirs",
    "pydantic>=2",
    "textual",
    "typer",
]

[project.scripts]
haven = "haven.interfaces.cli:app"

[dependency-groups]
dev = [
    "coverage",
    "hypothesis",
    "import-linter",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "respx",
    "ruff",
]
# evals/real 中固定版本第三方仓库仅用于测试的依赖
#（它们的测试套件必须在此虚拟环境中通过；见 evals/real/repos.lock）：
# markupsafe + trio 是 jinja 声明的测试依赖，wcag-contrast-ratio 是 pygments
# 的依赖。它们纯粹用于测试基础设施，Haven 本身不会导入任何一个。
real-evals = [
    "markupsafe",
    "trio",
    "wcag-contrast-ratio",
]

[tool.uv]
default-groups = ["dev", "real-evals"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Ruff 会格式化 Markdown 中围栏里的 Python。对于随项目发布的 prose 这很合适，
# 但计划中的片段是有意保留的代码碎片——可能只是一个参数行或不完整调用；
# 把它们当作完整模块格式化会破坏指令：`flag: bool = True,` 会变成
# `flag: bool = (True,)`。
exclude = ["docs/superpowers/plans/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["haven"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 单项测试若超过 30 秒，通常意味着子进程、事件队列或异步任务没有被回收。
# 这是每测试上限，不限制完整套件的总运行时间。
timeout = 30

[tool.importlinter]
root_package = "haven"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is isolated"
type = "forbidden"
source_modules = ["haven.domain"]
forbidden_modules = [
    "haven.adapters",
    "haven.interfaces",
    "textual",
    "httpx",
    "aiosqlite",
]

[[tool.importlinter.contracts]]
name = "application does not import adapters"
type = "forbidden"
source_modules = ["haven.application"]
forbidden_modules = ["haven.adapters"]

# 接口只能通过组合根（haven.bootstrap）或评估测试框架访问适配器；禁止直接导入。
[[tool.importlinter.contracts]]
name = "interfaces do not import adapters directly"
type = "forbidden"
source_modules = ["haven.interfaces"]
forbidden_modules = ["haven.adapters"]
allow_indirect_imports = true
